include:
  - project.yml
targets:
  TennisTracker:
    info:
      properties:
        CFBundleVersion: "22"
    settings:
      base:
        CURRENT_PROJECT_VERSION: "22"
  TennisTrackerWatchApp:
    info:
      properties:
        CFBundleVersion: "22"
        TennisHealthEnabled: true
        NSHealthShareUsageDescription: Tennis Tracker reads workout information, heart rate and active energy to link your tennis training to its saved Health workout when you allow it.
        NSHealthUpdateUsageDescription: Tennis Tracker saves tennis training workouts to Apple Health when you allow it.
        WKBackgroundModes:
          - workout-processing
    settings:
      base:
        CURRENT_PROJECT_VERSION: "22"
    entitlements:
      path: TennisTrackerWatchApp/Health.entitlements
      properties:
        com.apple.developer.healthkit: true
