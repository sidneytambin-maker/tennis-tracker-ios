name: TennisTrackeriOS
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  TennisTracker:
    type: application
    platform: iOS
    sources:
      - TennisTracker
    info:
      path: TennisTracker/Info.plist
      properties:
        CFBundleDisplayName: Tennis Tracker
        CFBundleShortVersionString: "0.7.0"
        CFBundleVersion: "7"
        CFBundleURLTypes:
          - CFBundleURLName: com.inclusophy.tennistracker.dev
            CFBundleURLSchemes:
              - tennistracker
        NSCalendarsFullAccessUsageDescription: Tennis Tracker can add your matches, training sessions, and tournaments to Apple Calendar when you ask it to.
        NSCalendarsWriteOnlyAccessUsageDescription: Tennis Tracker can add your tennis plans to Apple Calendar when you ask it to.
        NSCalendarsUsageDescription: Tennis Tracker can add your tennis plans to Apple Calendar when you ask it to.
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inclusophy.tennistracker.dev
        PRODUCT_NAME: TennisTracker
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
  TennisTrackerTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: TennisTracker
    sources:
      - TennisTrackerTests
    dependencies:
      - target: TennisTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inclusophy.tennistracker.dev.tests
  TennisTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TennisTrackerUITests
    dependencies:
      - target: TennisTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inclusophy.tennistracker.dev.uitests
schemes:
  TennisTracker:
    build:
      targets:
        TennisTracker: all
    test:
      targets:
        - TennisTrackerTests
        - TennisTrackerUITests
