name: TennisTrackeriOS
options:
  minimumXcodeGenVersion: 2.42.0
  postGenCommand: |
    if grep -q 'dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";' TennisTrackeriOS.xcodeproj/project.pbxproj; then
      sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|' -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' TennisTrackeriOS.xcodeproj/project.pbxproj
    fi
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  TennisTracker:
    type: application
    platform: iOS
    sources:
      - TennisTracker
    dependencies:
      - target: TennisTrackerWatchApp
        embed: true
    info:
      path: TennisTracker/Info.plist
      properties:
        CFBundleDisplayName: Tennis Tracker
        CFBundleShortVersionString: "0.7.1"
        CFBundleVersion: "8"
        CFBundleURLTypes:
          - CFBundleURLName: com.inclusophy.tennistracker.dev
            CFBundleURLSchemes:
              - tennistracker
        NSCalendarsFullAccessUsageDescription: Tennis Tracker can add your matches, training sessions, and tournaments to Apple Calendar when you ask it to.
        NSCalendarsWriteOnlyAccessUsageDescription: Tennis Tracker can add your tennis plans to Apple Calendar when you ask it to.
        NSCalendarsUsageDescription: Tennis Tracker can add your tennis plans to Apple Calendar when you ask it to.
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inclusophy.tennistracker.dev
        PRODUCT_NAME: TennisTracker
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "8"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
  TennisTrackerTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: TennisTracker
    sources:
      - TennisTrackerTests
    dependencies:
      - target: TennisTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inclusophy.tennistracker.dev.tests
  TennisTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TennisTrackerUITests
    dependencies:
      - target: TennisTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inclusophy.tennistracker.dev.uitests
  TennisTrackerWatchApp:
    type: application
    platform: watchOS
    sources:
      - TennisTrackerWatchApp
    info:
      path: TennisTrackerWatchApp/Info.plist
      properties:
        CFBundleDisplayName: Tennis Tracker
        CFBundleShortVersionString: "0.7.1"
        CFBundleVersion: "8"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.inclusophy.tennistracker.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inclusophy.tennistracker.dev.watchkitapp
        PRODUCT_NAME: TennisTrackerWatchApp
        MARKETING_VERSION: "0.7.1"
        CURRENT_PROJECT_VERSION: "8"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  TennisTracker:
    build:
      targets:
        TennisTracker: all
    test:
      targets:
        - TennisTrackerTests
        - TennisTrackerUITests
